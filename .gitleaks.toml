# gitleaks: default secret rules + personal data. Companion of skill pii-scan.
[extend]
useDefault = true

[[rules]]
id = "email"
description = "e-mail address"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[a-z]{2,}'''
[rules.allowlist]
regexTarget = "line"
regexes = [
  '''noreply@''',
  '''@users\.noreply\.github\.com''', # GitHub noreply commit identity, author of this history
  '''example\.com''',
  '''0x0lor1n@''',            # public contact of the hisilome site (github:0x0lor1n/hisilome); still quoted in .hermes/state
  '''nikita\.vyach\.ivanov@''', # upstream dwl movestack patch author
  '''git@[A-Za-z0-9.*-]+:''', # ssh remote URL (git@host:path), not an address
  '''deathray-testing x@y\.com''', # p10k config template's example gcloud account
  '''addon@darkreader\.org''',     # Firefox addon GUIDs (AMO), not addresses
  '''wappalyzer@crunchlabz\.com''',
]

[[rules]]
id = "entra-tenant"
description = "Entra tenant domain in plaintext; belongs in globals.nix.age"
regex = '''[A-Za-z0-9-]+\.onmicrosoft\.com'''

[[rules]]
id = "mac-address"
regex = '''\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b'''

[[rules]]
id = "phone-e164"
regex = '''\+[1-9][0-9]{7,14}\b'''

[allowlist]
paths = [
  '''.*\.age$''',
  '''flake\.lock$''',
  '''.*\.patch$''',
  '''.*\.svg$''',
]
