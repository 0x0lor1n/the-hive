version: "0.5"
processes:
  # music/ is gitignored and rsynced in. Without this gate tag-music dies with a
  # bare "not a directory" and the dependency chain to liquidsoap wedges.
  check-music:
    command: |
      mkdir -p radio/state/logs
      if [ -z "$(find music -type f -print -quit 2>/dev/null)" ]; then
        echo "check-music: no files under cells/hisilome/music/ (gitignored; rsync it in)." >&2
        exit 1
      fi

  build-site:
    command: "zola build"

  # No-op on an unchanged library; keeps liquidsoap from analysing at resolve
  # time (~5s per track).
  tag-music:
    command: "tag-replaygain music"
    depends_on:
      check-music:
        condition: process_completed_successfully

  build-queue:
    command: "build-queue --rounds 8 music"
    depends_on:
      tag-music:
        condition: process_completed_successfully

  # reload_mode="watch" resets playback position, hence daily.
  queue-refresh:
    command: "while true; do sleep 86400; build-queue --rounds 8 music; done"
    depends_on:
      build-queue:
        condition: process_completed_successfully

  icecast:
    command: "icecast -c radio/icecast.xml"
    depends_on:
      check-music:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "127.0.0.1"
        port: 8000
        path: "/status-json.xsl"
      initial_delay_seconds: 2
      period_seconds: 2

  liquidsoap:
    command: "liquidsoap radio/radio.liq"
    depends_on:
      icecast:
        condition: process_healthy
      build-site:
        condition: process_completed_successfully
      build-queue:
        condition: process_completed_successfully

  listeners:
    command: "listener-count"
    depends_on:
      icecast:
        condition: process_healthy

  # Config is generated from the same locations the NixOS module uses
  # (packages.nix nginxLocations); :8099.
  nginx:
    command: "dev-nginx"
    depends_on:
      build-site:
        condition: process_completed_successfully
      icecast:
        condition: process_healthy
