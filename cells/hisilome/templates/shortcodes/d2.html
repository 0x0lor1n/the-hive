{#- Inline the compiled d2 SVG so its text is selectable and searchable; an
    <img> would isolate it. static/ is copied verbatim, so the same file also
    serves as the open-in-new-tab target. -#}
<figure class="d2" role="img" aria-label="{{ alt }}">
{{ load_data(path="static/diagrams/" ~ name ~ ".svg") | safe }}
</figure>
