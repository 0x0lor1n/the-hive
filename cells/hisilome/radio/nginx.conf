daemon off;
error_log radio/state/logs/nginx_error.log;
pid radio/state/nginx.pid;

# Two connections per listener (client<->nginx, nginx<->icecast).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /nix/store/3ahghgds1g6x5b10q8p95pwh1njgg191-nginx-1.30.4/conf/mime.types;
    default_type application/octet-stream;

    # The shell's own frame also requests "/", but carries Sec-Fetch-Dest:
    # iframe - which is what stops the shell from framing itself forever.
    map $http_sec_fetch_dest $root_document {
        iframe  /index.html;
        default /listen.html;
    }
    access_log radio/state/logs/nginx_access.log;
    client_body_temp_path radio/state/nginx_client_body;
    proxy_temp_path radio/state/nginx_proxy;

    server {
        listen 8099;
        server_name localhost;
        root public;
        ssi on;
        index index.html;

        location = / {
            try_files $root_document =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location = /stream.mp3 {
            proxy_pass http://127.0.0.1:8000/stream.mp3;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding off;

            # Icecast answers "ICY 200 OK" rather than an HTTP status line when
            # the client sends Icy-MetaData: 1; nginx cannot parse that -> 502.
            proxy_set_header Icy-MetaData "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # default 60s trips on a liquidsoap restart
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;

            gzip off;
        }

        # Fragments below live outside public/ so `zola build` cannot delete
        # them. Distinct path from /schedule.html, which is the wrapper page.
        location = /schedule-body.html {
            alias radio/state/schedule.html;
            default_type text/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            ssi off;
        }

        location = /console.html {
            alias radio/state/console.html;
            default_type text/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            ssi off;
        }

        location = /listeners.txt {
            alias radio/state/listeners.txt;
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            ssi off;
        }

        location = /now-playing.txt {
            alias radio/state/now-playing.txt;
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            ssi off;
        }
    }
}
